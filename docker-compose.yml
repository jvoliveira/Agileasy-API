version: '3.8'

services:
  db:
    image: postgres
    environment:
      POSTGRES_PASSWORD: beribo
      POSTGRES_USER: postgres
      POSTGRES_DB: delivery
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
  serv:
    build: .
    depends_on:
      - db
    ports:
      - '4107:2503'
    environment:
      POSTGRES_HOST: db
      NODE_ENV: development
      POSTGRES_PASSWORD: beribo
      POSTGRES_USER: postgres
      POSTGRES_DB: delivery
      PORT: 2503
      HOST: 0.0.0.0
