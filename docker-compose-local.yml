version: '3.8'

services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: beribo
      POSTGRES_USER: postgres
      POSTGRES_DB: delivery
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5432:5432'
  db-2:
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: beribo
      POSTGRES_USER: postgres
      POSTGRES_DB: test
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '5433:5432'